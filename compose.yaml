services:
  eventops:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EVENTOPS_DATA_DIR: /data
      EVENTOPS_BASE_URL: ${EVENTOPS_BASE_URL:-http://localhost:8000}
      EVENTOPS_ALLOWED_HOSTS: ${EVENTOPS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      EVENTOPS_SECURE_COOKIES: ${EVENTOPS_SECURE_COOKIES:-0}
    volumes:
      - eventops_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  eventops_data:
