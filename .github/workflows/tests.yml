name: EventOps tests
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check web/app.js
